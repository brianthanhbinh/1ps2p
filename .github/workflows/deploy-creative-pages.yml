name: Deploy Creative to GitHub Pages
# Fresh workflow runs create a single Pages artifact; do not rerun a failed deployment attempt.

on:
  push:
    branches: [main]
    paths:
      - "creative/**"
      - ".github/workflows/deploy-creative-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: creative-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Creative site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: creative

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
