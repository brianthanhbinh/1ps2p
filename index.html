<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1ps2p Arena</title>
<style>
  body { margin: 0; background: #111; color: #fff; overflow: hidden; font-family: sans-serif; }
  canvas { display: block; background: #222; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let lastPortalTime = 0;
const PORTAL_COOLDOWN = 250; // ms debounce to prevent double-firing per single click

window.addEventListener('mousedown', (e) => {
    const now = performance.now();
    if (now - lastPortalTime < PORTAL_COOLDOWN) return;
    lastPortalTime = now;

    // Handle portal placement / click logic here
    console.log("Portal placed at:", e.clientX, e.clientY);
});

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.fillText("1ps2p Arena - Click to place portal (debounced)", 20, 30);
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
