<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D P2P FPS Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #game-canvas { width: 100%; height: 100%; display: block; }
    
    /* UI Overlay */
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.9); border-radius: 50%; background: rgba(0,0,0,0.3); }
    
    /* Connection Panel */
    #lobby-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,15,20,0.95); color: #fff; padding: 24px; border-radius: 12px; text-align: center; pointer-events: auto; width: 360px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    #lobby-panel h2 { margin-bottom: 15px; color: #4caf50; font-size: 22px; }
    #lobby-panel input, #lobby-panel button { width: 100%; margin: 6px 0; padding: 10px 12px; border: none; border-radius: 6px; font-family: inherit; font-size: 14px; }
    #lobby-panel input { background: #222; color: #fff; border: 1px solid #444; text-align: center; }
    #lobby-panel button { background: #4caf50; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    #lobby-panel button:hover { background: #45a049; }
    #peer-id-display { font-size: 12px; color: #ffca28; margin-top: 8px; font-weight: bold; }

    /* HUD Stats (HP / Stamina / Airdrop) */
    #hud-container { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 8px; width: 220px; }
    .bar-wrapper { background: rgba(0,0,0,0.6); padding: 4px; border-radius: 6px; border: 1px solid #444; }
    .bar-label { color: #fff; font-size: 10px; font-weight: bold; margin-bottom: 2px; display: flex; justify-content: space-between; }
    .bar-bg { width: 100%; height: 12px; background: #222; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.1s linear; }
    #hp-fill { background: #e53935; width: 100%; }
    #stamina-fill { background: #29b6f6; width: 100%; }

    #airdrop-pill { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 20px; border: 1px solid #444; color: #fff; font-size: 13px; font-weight: bold; }
    #airdrop-timer { color: #ffca28; }

    /* Player List (TAB Overlay) */
    #tab-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,15,20,0.9); border: 1px solid #444; border-radius: 10px; width: 340px; padding: 16px; color: #fff; display: none; pointer-events: none; }
    #tab-overlay h3 { font-size: 14px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; color: #29b6f6; }
    .player-row { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.05); margin-bottom: 4px; border-radius: 4px; font-size: 13px; }

    /* Hotbar */
    #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px; border: 1px solid #555; }
    .slot { width: 56px; height: 56px; background: #222; border: 2px solid #444; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-size: 11px; position: relative; overflow: hidden; }
    .slot.active { border-color: #ffca28; background: #333; box-shadow: 0 0 10px rgba(255,202,40,0.4); }
    .slot-cooldown { position: absolute; bottom: 0; left: 0; height: 100%; background: rgba(229,57,53,0.5); width: 0%; transition: width 0.05s linear; }

    /* Inventory Screen */
    #inventory-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; pointer-events: auto; }
    .inv-window { background: #1a1a24; color: #fff; border: 2px solid #444; border-radius: 12px; width: 420px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
    .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 15px; }
    .inv-slot { height: 75px; background: #252533; border: 1px solid #3d3d52; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; }

    #status-msg { position: absolute; top: 55px; width: 100%; text-align: center; color: #aaa; font-size: 13px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <div id="ui">
    <div id="crosshair"></div>
    
    <div id="hud-container">
      <div class="bar-wrapper">
        <div class="bar-label"><span>HEALTH</span><span id="hp-val">100</span></div>
        <div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div>
      </div>
      <div class="bar-wrapper">
        <div class="bar-label"><span>STAMINA (CTRL)</span><span id="stamina-val">100</span></div>
        <div class="bar-bg"><div id="stamina-fill" class="bar-fill"></div></div>
      </div>
    </div>

    <div id="airdrop-pill">✈️ Airdrop: <span id="airdrop-timer">--s</span></div>
    <div id="status-msg">Click Host or Join to Start</div>

    <div id="lobby-panel">
      <h2>3D P2P Arena</h2>
      <input type="text" id="player-name-input" placeholder="Your Display Name" value="Player">
      <input type="text" id="custom-room-input" placeholder="Room Code / Host ID (e.g. room123)">
      <button id="btn-host">Host Room</button>
      <button id="btn-join">Join Room</button>
      <div id="peer-id-display">Initializing network...</div>
    </div>

    <div id="tab-overlay">
      <h3>ACTIVE PEERS (TAB)</h3>
      <div id="peer-list-container"></div>
    </div>

    <div id="hotbar">
      <div class="slot active" id="slot-0"><span>1</span><b>Sword</b></div>
      <div class="slot" id="slot-1"><span>2</span><b>Pickaxe</b></div>
      <div class="slot" id="slot-2">
        <span>3</span><b>Block</b>
        <div class="slot-cooldown" id="block-cd"></div>
      </div>
    </div>

    <div id="inventory-overlay">
      <div class="inv-window">
        <h3>Player Inventory</h3>
        <p style="font-size: 12px; color: #aaa;">Press E to Close</p>
        <div class="inv-grid">
          <div class="inv-slot">⚔️ Sword<br><small style="color:#888;">Melee</small></div>
          <div class="inv-slot">⛏️ Pickaxe<br><small style="color:#888;">Mine/Crate</small></div>
          <div class="inv-slot">📦 Block<br><small style="color:#888;">Inf (1s CD)</small></div>
          <div class="inv-slot" id="inv-crates">📦 Crates<br><b id="crate-count" style="color:#ffca28; font-size: 16px;">0</b></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- CONSTANTS & CONFIG ---
    const BLOCK_SIZE = 1;
    const BLOCK_COOLDOWN_MS = 1000;
    const PLAYER_HEIGHT = 1.6;
    const PLAYER_RADIUS = 0.4;
    
    let isHost = false;
    let peer = null;
    let myId = '';
    let myName = 'Player';
    let connections = {}; // Host: peerId -> { conn, lastPing, name }
    let hostConn = null;

    // Local Stats
    let hp = 100;
    let stamina = 100;
    const maxStamina = 100;
    let isSprinting = false;

    // Entities & Physics World
    let players = {}; // id -> { mesh, name, bbox, targetPos, targetRot }
    let collidables = []; // Meshes for AABB collision check
    let placedBlocks = {}; // key -> mesh
    let activeCrates = {}; // id -> mesh
    let cratesCollected = 0;
    
    let activeSlot = 0; 
    let blockCooldownActive = false;
    let isInvOpen = false;

    // Animations & Timers
    let isSwinging = false;
    let swingProgress = 0;
    let airdropCountdown = 0;
    let airdropTimerInterval = null;

    // Helper: Simplify ID string into clean short codes (e.g. room123)
    function sanitizeId(str) {
      return str.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    }

    // --- THREE.JS SETUP ---
    const canvas = document.getElementById('game-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(30, 50, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a5a40 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const blockGeo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
    const blockMat = new THREE.MeshStandardMaterial({ color: 0x8d5b4c });
    const crateMat = new THREE.MeshStandardMaterial({ color: 0xd4a373 });

    // Item Rig attached to Camera
    const itemRig = new THREE.Group();
    camera.add(itemRig);
    scene.add(camera);

    // Sword
    const swordMesh = new THREE.Group();
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.7, 0.08), new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8 }));
    blade.position.y = 0.35;
    const guard = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.04, 0.1), new THREE.MeshStandardMaterial({ color: 0xaa8833 }));
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 0.05), new THREE.MeshStandardMaterial({ color: 0x442211 }));
    handle.position.y = -0.1;
    swordMesh.add(blade, guard, handle);
    swordMesh.position.set(0.35, -0.25, -0.5);

    // Pickaxe
    const pickaxeMesh = new THREE.Group();
    const pickHandle = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.65, 0.05), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
    const pickHead = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.08), new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.5 }));
    pickHead.position.y = 0.28;
    pickaxeMesh.add(pickHandle, pickHead);
    pickaxeMesh.position.set(0.35, -0.25, -0.5);

    // Block
    const heldBlockMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), blockMat);
    heldBlockMesh.position.set(0.35, -0.25, -0.5);

    itemRig.add(swordMesh, pickaxeMesh, heldBlockMesh);

    function updateToolVisibility() {
      swordMesh.visible = activeSlot === 0;
      pickaxeMesh.visible = activeSlot === 1;
      heldBlockMesh.visible = activeSlot === 2;
    }
    updateToolVisibility();

    function createPlayerMesh(name = 'Peer', color = 0x2196f3) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.4), new THREE.MeshStandardMaterial({ color }));
      body.position.y = 0.6;
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xffe0bd }));
      head.position.y = 1.4;
      group.add(body, head);

      // Nameplate Canvas Sprite
      const canvasName = document.createElement('canvas');
      canvasName.width = 256; canvasName.height = 64;
      const ctx = canvasName.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, 256, 64);
      ctx.font = 'bold 28px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(name, 128, 42);

      const texture = new THREE.CanvasTexture(canvasName);
      const spriteMat = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.position.y = 2.0;
      sprite.scale.set(2, 0.5, 1);
      group.add(sprite);

      scene.add(group);
      return group;
    }

    // --- CONTROLS & SOLID AABB COLLISION SYSTEM ---
    const keys = {};
    let velocityY = 0;
    const gravity = -0.015;
    let isGrounded = false;

    canvas.addEventListener('click', () => {
      if (!isInvOpen) canvas.requestPointerLock();
    });

    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === canvas) {
        euler.setFromQuaternion(camera.quaternion);
        euler.y -= e.movementX * 0.002;
        euler.x -= e.movementY * 0.002;
        euler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, euler.x));
        camera.quaternion.setFromEuler(euler);
      }
    });

    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;

      if (e.code === 'Digit1') switchSlot(0);
      if (e.code === 'Digit2') switchSlot(1);
      if (e.code === 'Digit3') switchSlot(2);

      if (e.code === 'KeyE') {
        isInvOpen = !isInvOpen;
        document.getElementById('inventory-overlay').style.display = isInvOpen ? 'flex' : 'none';
        if (isInvOpen) document.exitPointerLock();
        else canvas.requestPointerLock();
      }

      if (e.code === 'Tab') {
        e.preventDefault();
        document.getElementById('tab-overlay').style.display = 'block';
      }
    });

    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Tab') {
        document.getElementById('tab-overlay').style.display = 'none';
      }
    });

    function switchSlot(slotIndex) {
      activeSlot = slotIndex;
      updateToolVisibility();
      for(let i = 0; i < 3; i++) {
        document.getElementById(`slot-${i}`).classList.toggle('active', i === activeSlot);
      }
    }

    // STRICT AABB HITBOX COLLISION RESOLUTION
    function resolvePlayerCollisions(newPos) {
      const playerBox = new THREE.Box3(
        new THREE.Vector3(newPos.x - PLAYER_RADIUS, newPos.y - PLAYER_HEIGHT, newPos.z - PLAYER_RADIUS),
        new THREE.Vector3(newPos.x + PLAYER_RADIUS, newPos.y, newPos.z + PLAYER_RADIUS)
      );

      collidables = Object.values(placedBlocks).concat(Object.values(activeCrates));

      for (let mesh of collidables) {
        const blockBox = new THREE.Box3().setFromObject(mesh);
        if (playerBox.intersectsBox(blockBox)) {
          // Calculate overlap depth along axes
          const overlapX = Math.min(playerBox.max.x - blockBox.min.x, blockBox.max.x - playerBox.min.x);
          const overlapY = Math.min(playerBox.max.y - blockBox.min.y, blockBox.max.y - playerBox.min.y);
          const overlapZ = Math.min(playerBox.max.z - blockBox.min.z, blockBox.max.z - playerBox.min.z);

          // Resolve on smallest collision axis
          if (overlapY < overlapX && overlapY < overlapZ) {
            if (playerBox.min.y < blockBox.min.y) {
              newPos.y -= overlapY;
              velocityY = 0;
            } else {
              newPos.y += overlapY;
              velocityY = 0;
              isGrounded = true;
            }
          } else if (overlapX < overlapZ) {
            if (playerBox.min.x < blockBox.min.x) newPos.x -= overlapX;
            else newPos.x += overlapX;
          } else {
            if (playerBox.min.z < blockBox.min.z) newPos.z -= overlapZ;
            else newPos.z += overlapZ;
          }
          // Recalculate BBox after adjustment
          playerBox.set(
            new THREE.Vector3(newPos.x - PLAYER_RADIUS, newPos.y - PLAYER_HEIGHT, newPos.z - PLAYER_RADIUS),
            new THREE.Vector3(newPos.x + PLAYER_RADIUS, newPos.y, newPos.z + PLAYER_RADIUS)
          );
        }
      }
    }

    // RAYCASTING & BLOCK PLACEMENT FIX
    const raycaster = new THREE.Raycaster();
    document.addEventListener('mousedown', (e) => {
      if (document.pointerLockElement !== canvas) return;
      if (e.button === 0) {
        isSwinging = true;
        swingProgress = 0;
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

        if (activeSlot === 2 && !blockCooldownActive) {
          const targetables = Object.values(placedBlocks).concat(Object.values(activeCrates)).concat(ground);
          const intersects = raycaster.intersectObjects(targetables);

          if (intersects.length > 0 && intersects[0].distance < 6) {
            const hit = intersects[0];
            const normal = hit.face.normal.clone();
            
            // GRID SNAP FIX: Compute center coordinates strictly aligned to whole numbers
            let target;
            if (hit.object === ground) {
              target = new THREE.Vector3(
                Math.floor(hit.point.x) + 0.5,
                0.5,
                Math.floor(hit.point.z) + 0.5
              );
            } else {
              const placedCenter = hit.object.position.clone().add(normal);
              target = new THREE.Vector3(
                Math.floor(placedCenter.x) + 0.5,
                Math.floor(placedCenter.y) + 0.5,
                Math.floor(placedCenter.z) + 0.5
              );
            }

            // Prevent placing block inside player's body
            const pBox = new THREE.Box3(
              new THREE.Vector3(camera.position.x - PLAYER_RADIUS, camera.position.y - PLAYER_HEIGHT, camera.position.z - PLAYER_RADIUS),
              new THREE.Vector3(camera.position.x + PLAYER_RADIUS, camera.position.y, camera.position.z + PLAYER_RADIUS)
            );
            const bBox = new THREE.Box3(
              new THREE.Vector3(target.x - 0.5, target.y - 0.5, target.z - 0.5),
              new THREE.Vector3(target.x + 0.5, target.y + 0.5, target.z + 0.5)
            );

            if (!pBox.intersectsBox(bBox)) {
              const key = `${target.x},${target.y},${target.z}`;
              dispatchNetworkAction({ type: 'PLACE_BLOCK', key, pos: [target.x, target.y, target.z] });
              triggerBlockCooldown();
            }
          }
        } else if (activeSlot === 1) {
          // Mine Block
          const blockIntersects = raycaster.intersectObjects(Object.values(placedBlocks));
          if (blockIntersects.length > 0 && blockIntersects[0].distance < 6) {
            const obj = blockIntersects[0].object;
            const key = Object.keys(placedBlocks).find(k => placedBlocks[k] === obj);
            if (key) dispatchNetworkAction({ type: 'BREAK_BLOCK', key });
          }

          // Mine Crate
          const crateIntersects = raycaster.intersectObjects(Object.values(activeCrates));
          if (crateIntersects.length > 0 && crateIntersects[0].distance < 6) {
            const crateObj = crateIntersects[0].object;
            const crateId = Object.keys(activeCrates).find(id => activeCrates[id] === crateObj);
            if (crateId) dispatchNetworkAction({ type: 'COLLECT_CRATE', crateId });
          }
        }
      }
    });

    function triggerBlockCooldown() {
      blockCooldownActive = true;
      const cdBar = document.getElementById('block-cd');
      cdBar.style.width = '100%';
      let elapsed = 0;
      const interval = setInterval(() => {
        elapsed += 50;
        cdBar.style.width = `${Math.max(0, 100 - (elapsed / BLOCK_COOLDOWN_MS) * 100)}%`;
        if (elapsed >= BLOCK_COOLDOWN_MS) {
          clearInterval(interval);
          blockCooldownActive = false;
        }
      }, 50);
    }

    function placeBlockLocally(key, pos) {
      if (placedBlocks[key]) return;
      const b = new THREE.Mesh(blockGeo, blockMat);
      b.position.set(...pos);
      b.castShadow = true;
      b.receiveShadow = true;
      scene.add(b);
      placedBlocks[key] = b;
    }

    function breakBlockLocally(key) {
      if (placedBlocks[key]) {
        scene.remove(placedBlocks[key]);
        delete placedBlocks[key];
      }
    }

    function collectCrateLocally(crateId) {
      if (activeCrates[crateId]) {
        scene.remove(activeCrates[crateId]);
        delete activeCrates[crateId];
        cratesCollected++;
        document.getElementById('crate-count').innerText = cratesCollected;
      }
    }

    // --- AIRDROP SYSTEM ---
    let activeSupplyPlane = null;

    function spawnSupplyDrop(targetX, targetZ, crateId) {
      const planeGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 5), new THREE.MeshStandardMaterial({ color: 0x333333 }));
      const wings = new THREE.Mesh(new THREE.BoxGeometry(8, 0.08, 1.2), new THREE.MeshStandardMaterial({ color: 0x222222 }));
      planeGroup.add(body, wings);

      const startPos = new THREE.Vector3(targetX - 80, 25, targetZ);
      const endPos = new THREE.Vector3(targetX + 80, 25, targetZ);
      planeGroup.position.copy(startPos);
      planeGroup.lookAt(endPos);
      scene.add(planeGroup);

      let dropped = false;
      activeSupplyPlane = {
        mesh: planeGroup,
        start: startPos,
        end: endPos,
        progress: 0,
        update: function(delta) {
          this.progress += delta * 0.12;
          this.mesh.position.lerpVectors(this.start, this.end, this.progress);

          if (this.progress >= 0.5 && !dropped) {
            dropped = true;
            spawnCrateMesh(crateId, targetX, 25, targetZ);
          }
          if (this.progress >= 1) {
            scene.remove(this.mesh);
            activeSupplyPlane = null;
          }
        }
      };
    }

    function spawnCrateMesh(crateId, x, y, z) {
      const crate = new THREE.Mesh(blockGeo, crateMat);
      crate.position.set(x, y, z);
      crate.castShadow = true;
      scene.add(crate);
      activeCrates[crateId] = crate;
    }

    function startAirdropTimer(seconds) {
      airdropCountdown = seconds;
      clearInterval(airdropTimerInterval);
      airdropTimerInterval = setInterval(() => {
        airdropCountdown--;
        document.getElementById('airdrop-timer').innerText = `${Math.max(0, airdropCountdown)}s`;
        if (airdropCountdown <= 0) clearInterval(airdropTimerInterval);
      }, 1000);
    }

    function scheduleNextAirdropHost() {
      if (!isHost) return;
      const seconds = Math.floor(Math.random() * 15) + 15;
      broadcastState({ type: 'AIRDROP_TIMER', seconds });
      startAirdropTimer(seconds);

      setTimeout(() => {
        const dropX = (Math.random() - 0.5) * 40;
        const dropZ = (Math.random() - 0.5) * 40;
        const crateId = 'crate_' + Math.random().toString(36).substr(2, 9);

        broadcastState({ type: 'SPAWN_DROP', x: dropX, z: dropZ, crateId });
        spawnSupplyDrop(dropX, dropZ, crateId);
        scheduleNextAirdropHost();
      }, seconds * 1000);
    }

    // --- NETWORKING & HEARTBEAT SYSTEM ---
    function initPeer(customId = null) {
      if (peer) peer.destroy();
      peer = customId ? new Peer(customId) : new Peer();

      peer.on('open', (id) => {
        myId = id;
        document.getElementById('peer-id-display').innerText = `Room ID: ${id}`;
      });

      peer.on('error', (err) => {
        alert("Connection Error: " + err.type);
      });

      // Host connection listener
      peer.on('connection', (conn) => {
        if (!isHost) return;

        conn.on('open', () => {
          connections[conn.peer] = { conn, lastPing: Date.now(), name: 'Peer' };
          updateTabOverlay();
        });

        conn.on('data', (data) => handleHostReceiveData(conn.peer, data));
        conn.on('close', () => removePeer(conn.peer));
      });
    }

    function removePeer(peerId) {
      if (players[peerId]) {
        scene.remove(players[peerId].mesh);
        delete players[peerId];
      }
      delete connections[peerId];
      updateTabOverlay();
    }

    // HEARTBEAT & TIMEOUT CHECK (Evict Unresponsive Peers)
    setInterval(() => {
      if (!isHost) return;
      const now = Date.now();
      Object.keys(connections).forEach(id => {
        if (now - connections[id].lastPing > 4000) { // 4 seconds timeout
          connections[id].conn.close();
          removePeer(id);
        }
      });
    }, 2000);

    function handleHostReceiveData(senderId, data) {
      if (connections[senderId]) connections[senderId].lastPing = Date.now();

      if (data.type === 'PLAYER_SYNC') {
        if (connections[senderId]) connections[senderId].name = data.name;

        if (!players[senderId]) {
          players[senderId] = { mesh: createPlayerMesh(data.name, 0xe91e63) };
          updateTabOverlay();
        }
        players[senderId].mesh.position.set(...data.pos);
        players[senderId].mesh.rotation.y = data.rotY;
        
        broadcastState({ type: 'WORLD_STATE', players: serializePlayers() });
      } else if (data.type === 'ACTION') {
        if (data.action.type === 'PLACE_BLOCK') placeBlockLocally(data.action.key, data.action.pos);
        if (data.action.type === 'BREAK_BLOCK') breakBlockLocally(data.action.key);
        if (data.action.type === 'COLLECT_CRATE') collectCrateLocally(data.action.crateId);
        broadcastState({ type: 'ACTION', action: data.action });
      }
    }

    function broadcastState(msg) {
      Object.values(connections).forEach(c => c.conn.send(msg));
    }

    function dispatchNetworkAction(action) {
      if (isHost) {
        if (action.type === 'PLACE_BLOCK') placeBlockLocally(action.key, action.pos);
        if (action.type === 'BREAK_BLOCK') breakBlockLocally(action.key);
        if (action.type === 'COLLECT_CRATE') collectCrateLocally(action.crateId);
        broadcastState({ type: 'ACTION', action });
      } else if (hostConn) {
        hostConn.send({ type: 'ACTION', action });
      }
    }

    function serializePlayers() {
      const state = {};
      Object.keys(players).forEach(id => {
        state[id] = {
          name: players[id].name || 'Peer',
          pos: [players[id].mesh.position.x, players[id].mesh.position.y, players[id].mesh.position.z],
          rotY: players[id].mesh.rotation.y
        };
      });
      state[myId] = { name: myName, pos: [camera.position.x, camera.position.y - 1.2, camera.position.z], rotY: camera.rotation.y };
      return state;
    }

    function updateTabOverlay() {
      const container = document.getElementById('peer-list-container');
      container.innerHTML = '';

      // Local player row
      const localRow = document.createElement('div');
      localRow.className = 'player-row';
      localRow.innerHTML = `<span>${myName} (You)</span><span style="color:#4caf50;">HOST</span>`;
      container.appendChild(localRow);

      // Peer rows
      Object.keys(players).forEach(id => {
        if (id === myId) return;
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `<span>${players[id].name || 'Peer'}</span><span style="color:#29b6f6;">CLIENT</span>`;
        container.appendChild(row);
      });
    }

    // UI Host/Join Handlers
    document.getElementById('btn-host').addEventListener('click', () => {
      myName = document.getElementById('player-name-input').value.trim() || 'Host';
      const customCode = sanitizeId(document.getElementById('custom-room-input').value);
      
      isHost = true;
      initPeer(customCode || null);

      document.getElementById('lobby-panel').style.display = 'none';
      document.getElementById('status-msg').innerText = `Hosting as "${myName}"`;
      scheduleNextAirdropHost();
      updateTabOverlay();
      canvas.requestPointerLock();
    });

    document.getElementById('btn-join').addEventListener('click', () => {
      myName = document.getElementById('player-name-input').value.trim() || 'Client';
      const hostCode = sanitizeId(document.getElementById('custom-room-input').value);
      if (!hostCode) return alert('Enter Host Room Code');

      initPeer();
      
      setTimeout(() => {
        hostConn = peer.connect(hostCode);
        hostConn.on('open', () => {
          document.getElementById('lobby-panel').style.display = 'none';
          document.getElementById('status-msg').innerText = `Joined Room as "${myName}"`;
          canvas.requestPointerLock();
        });

        hostConn.on('data', (data) => {
          if (data.type === 'WORLD_STATE') {
            Object.keys(data.players).forEach(id => {
              if (id === myId) return;
              if (!players[id]) {
                players[id] = { mesh: createPlayerMesh(data.players[id].name, 0x4caf50), name: data.players[id].name };
                updateTabOverlay();
              }
              players[id].mesh.position.set(...data.players[id].pos);
              players[id].mesh.rotation.y = data.players[id].rotY;
            });
          } else if (data.type === 'ACTION') {
            if (data.action.type === 'PLACE_BLOCK') placeBlockLocally(data.action.key, data.action.pos);
            if (data.action.type === 'BREAK_BLOCK') breakBlockLocally(data.action.key);
            if (data.action.type === 'COLLECT_CRATE') collectCrateLocally(data.action.crateId);
          } else if (data.type === 'SPAWN_DROP') {
            spawnSupplyDrop(data.x, data.z, data.crateId);
          } else if (data.type === 'AIRDROP_TIMER') {
            startAirdropTimer(data.seconds);
          }
        });
      }, 500);
    });

    // --- GAME LOOP ---
    camera.position.set(0, PLAYER_HEIGHT, 5);
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // STAMINA & SPRINT SYSTEM (CTRL KEY)
      isSprinting = keys['ControlLeft'] || keys['ControlRight'];
      let currentSpeed = moveSpeed;

      if (isSprinting && (keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD']) && stamina > 0) {
        currentSpeed *= 1.8;
        stamina = Math.max(0, stamina - delta * 30);
      } else {
        stamina = Math.min(maxStamina, stamina + delta * 15);
      }

      document.getElementById('stamina-fill').style.width = `${stamina}%`;
      document.getElementById('stamina-val').innerText = Math.round(stamina);
      document.getElementById('hp-fill').style.width = `${hp}%`;
      document.getElementById('hp-val').innerText = hp;

      // TOOL SWING ANIMATION
      if (isSwinging) {
        swingProgress += delta * 15;
        itemRig.rotation.x = -Math.sin(swingProgress) * 0.6;
        itemRig.rotation.y = -Math.sin(swingProgress) * 0.3;
        if (swingProgress >= Math.PI) {
          isSwinging = false;
          swingProgress = 0;
          itemRig.rotation.set(0, 0, 0);
        }
      } else {
        itemRig.position.y = Math.sin(now * 0.003) * 0.015;
      }

      // PLAYER MOVEMENT & SOLID HITBOX RESOLUTION
      if (document.pointerLockElement === canvas) {
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        forward.y = 0; forward.normalize();
        const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        side.y = 0; side.normalize();

        const moveVector = new THREE.Vector3();
        if (keys['KeyW']) moveVector.add(forward);
        if (keys['KeyS']) moveVector.sub(forward);
        if (keys['KeyA']) moveVector.sub(side);
        if (keys['KeyD']) moveVector.add(side);
        
        if (moveVector.lengthSq() > 0) moveVector.normalize().multiplyScalar(currentSpeed);

        const newPos = camera.position.clone().add(moveVector);

        // Jump & Gravity
        if (keys['Space'] && isGrounded) {
          velocityY = 0.25;
          isGrounded = false;
        }

        velocityY += gravity;
        newPos.y += velocityY;

        // Ground Clamp
        if (newPos.y <= PLAYER_HEIGHT) {
          newPos.y = PLAYER_HEIGHT;
          velocityY = 0;
          isGrounded = true;
        }

        // Apply Solid AABB Collision Resolution against blocks
        resolvePlayerCollisions(newPos);
        camera.position.copy(newPos);
      }

      // Plane & Crate Logic
      if (activeSupplyPlane) activeSupplyPlane.update(delta);

      Object.keys(activeCrates).forEach(crateId => {
        const crate = activeCrates[crateId];
        if (crate.position.y > 0.5) crate.position.y -= 0.15;
      });

      // Sync Network Loop
      if (now % 50 < 16) {
        const payload = {
          type: 'PLAYER_SYNC',
          name: myName,
          pos: [camera.position.x, camera.position.y - 1.2, camera.position.z],
          rotY: camera.rotation.y
        };
        if (isHost) {
          broadcastState({ type: 'WORLD_STATE', players: serializePlayers() });
        } else if (hostConn && hostConn.open) {
          hostConn.send(payload);
        }
      }

      renderer.render(scene, camera);
    }

    initPeer();
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
