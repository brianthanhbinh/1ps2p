<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1ps2p Arena</title>
<style>
  body { margin: 0; background: #111; color: #fff; overflow: hidden; font-family: sans-serif; }
  canvas { display: block; background: #222; margin: 0 auto; }
  #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; }
  button { padding: 5px 10px; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">
  Mode: <span id="modeDisplay">Portal</span>
  <button onclick="currentMode = 'portal'">Portal</button>
  <button onclick="currentMode = 'block'">Block</button>
</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let lastActionTime = 0;
const ACTION_COOLDOWN = 250; // ms debounce to prevent double-firing per single click
let currentMode = 'portal'; // 'portal' or 'block'

const portals = [];
const blocks = [];

window.addEventListener('mousedown', (e) => {
    // Ignore clicks on UI elements
    if (e.target.tagName === 'BUTTON' || e.target.id === 'ui') return;

    const now = performance.now();
    if (now - lastActionTime < ACTION_COOLDOWN) return;
    lastActionTime = now;

    if (currentMode === 'portal') {
        portals.push({ x: e.clientX, y: e.clientY });
        console.log("Portal placed at:", e.clientX, e.clientY);
    } else if (currentMode === 'block') {
        blocks.push({ x: e.clientX - 20, y: e.clientY - 20, width: 40, height: 40 });
        console.log("Block placed at:", e.clientX, e.clientY);
    }
});

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw blocks
    ctx.fillStyle = '#888';
    blocks.forEach(b => {
        ctx.fillRect(b.x, b.y, b.width, b.height);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(b.x, b.y, b.width, b.height);
    });

    // Draw portals
    portals.forEach((p, index) => {
        ctx.fillStyle = index % 2 === 0 ? '#00f' : '#f80';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
    });

    document.getElementById('modeDisplay').innerText = currentMode.toUpperCase();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
