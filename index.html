<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D P2P Arena Shooter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #game-canvas { width: 100%; height: 100%; display: block; background: #222; }
    
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    #lobby-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,15,20,0.95); color: #fff; padding: 24px; border-radius: 12px; text-align: center; pointer-events: auto; width: 380px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 20; }
    #lobby-panel h2 { margin-bottom: 15px; color: #4caf50; font-size: 22px; }
    #lobby-panel input, #lobby-panel button, #lobby-panel select { width: 100%; margin: 6px 0; padding: 10px 12px; border: none; border-radius: 6px; font-family: inherit; font-size: 14px; }
    #lobby-panel input, #lobby-panel select { background: #222; color: #fff; border: 1px solid #444; text-align: center; }
    #lobby-panel button { background: #4caf50; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    #lobby-panel button:hover { background: #45a049; }
    #peer-id-display { font-size: 12px; color: #ffca28; margin-top: 8px; font-weight: bold; word-break: break-all; }

    #modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; pointer-events: auto; z-index: 30; }
    .modal-window { background: #1a1a24; color: #fff; border: 2px solid #444; border-radius: 12px; width: 360px; padding: 24px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
    .modal-window h3 { margin-bottom: 15px; color: #ffca28; font-size: 20px; }
    .modal-window button { width: 100%; margin: 8px 0; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .team-btn-red { background: #e53935; color: #fff; }
    .team-btn-blue { background: #1e88e5; color: #fff; }
    .team-btn-green { background: #43a047; color: #fff; }
    .team-btn-yellow { background: #fbc02d; color: #000; }
    .team-btn-ffa { background: #7b1fa2; color: #fff; }

    #hud-container { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 8px; width: 220px; }
    .bar-wrapper { background: rgba(0,0,0,0.6); padding: 4px; border-radius: 6px; border: 1px solid #444; }
    .bar-label { color: #fff; font-size: 10px; font-weight: bold; margin-bottom: 2px; display: flex; justify-content: space-between; }
    .bar-bg { width: 100%; height: 12px; background: #222; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.1s linear; }
    #hp-fill { background: #e53935; width: 100%; }
    #stamina-fill { background: #29b6f6; width: 100%; }

    #airdrop-pill { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 20px; border: 1px solid #444; color: #fff; font-size: 13px; font-weight: bold; }
    #airdrop-timer { color: #ffca28; }

    #tab-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,15,20,0.92); border: 1px solid #444; border-radius: 12px; width: 360px; padding: 20px; color: #fff; display: none; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 15; }
    #tab-overlay h3 { font-size: 15px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; color: #29b6f6; }
    .player-row { display: flex; justify-content: space-between; padding: 8px 12px; background: rgba(255,255,255,0.06); margin-bottom: 6px; border-radius: 6px; font-size: 13px; align-items: center; }

    #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px; border: 1px solid #555; pointer-events: auto; }
    .slot { width: 56px; height: 56px; background: #222; border: 2px solid #444; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-size: 11px; position: relative; overflow: hidden; cursor: pointer; }
    .slot.active { border-color: #ffca28; background: #333; box-shadow: 0 0 10px rgba(255,202,40,0.4); }
    .slot-cooldown { position: absolute; bottom: 0; left: 0; height: 100%; background: rgba(229,57,53,0.5); width: 0%; transition: width 0.05s linear; }

    #status-msg { position: absolute; top: 55px; width: 100%; text-align: center; color: #aaa; font-size: 13px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <div id="ui">
    <div id="hud-container">
      <div class="bar-wrapper">
        <div class="bar-label"><span>HEALTH</span><span id="hp-val">100</span></div>
        <div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div>
      </div>
      <div class="bar-wrapper">
        <div class="bar-label"><span>STAMINA (SHIFT)</span><span id="stamina-val">100</span></div>
        <div class="bar-bg"><div id="stamina-fill" class="bar-fill"></div></div>
      </div>
    </div>

    <div id="airdrop-pill">✈️ Airdrop: <span id="airdrop-timer">--s</span></div>
    <div id="status-msg">Click Host or Join to Start</div>

    <div id="lobby-panel">
      <h2>2D P2P Arena Shooter</h2>
      <input type="text" id="player-name-input" placeholder="Your Display Name" value="Player">
      <select id="room-select">
        <option value="room1">Room 1</option>
        <option value="room2">Room 2</option>
        <option value="room3">Room 3</option>
        <option value="room4">Room 4</option>
        <option value="room5">Room 5</option>
      </select>
      <button id="btn-host">Host Room</button>
      <button id="btn-join">Join Room</button>
      <div id="peer-id-display">Cloud Ready</div>
    </div>

    <div id="modal-overlay">
      <div class="modal-window" id="modal-content">
        <h3 id="modal-title">Select Mode</h3>
        <div id="modal-buttons"></div>
      </div>
    </div>

    <div id="tab-overlay">
      <h3>ONLINE PLAYERS & TEAMS (TAB)</h3>
      <div id="peer-list-container"></div>
    </div>

    <div id="hotbar">
      <div class="slot active" id="slot-0" onclick="switchSlot(0)"><span>1</span><b>Sword</b></div>
      <div class="slot" id="slot-1" onclick="switchSlot(1)"><span>2</span><b>Pickaxe</b></div>
      <div class="slot" id="slot-2" onclick="switchSlot(2)"><span>3</span><b>Block</b><div class="slot-cooldown" id="block-cd"></div></div>
      <div class="slot" id="slot-3" onclick="switchSlot(3)"><span>4</span><b id="gun-slot-label">Empty</b></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const WORLD_SIZE = 2000;
    const TILE_SIZE = 40;

    let isHost = false;
    let peer = null;
    let myId = '';
    let myName = 'Player';
    let currentRoomCode = '';
    let gameMode = 'ffa';
    let myTeam = 'FFA';
    let myTeamColor = '#2196f3';

    let connections = {};
    let hostConn = null;

    let myX = WORLD_SIZE / 2;
    let myY = WORLD_SIZE / 2;
    let myAngle = 0;
    let hp = 100;
    let stamina = 100;
    const maxStamina = 100;

    let activeSlot = 0;
    let currentGun = null;
    let gunCooldown = false;
    let blockCooldown = false;

    let players = {};
    let placedBlocks = {}; // key: "gx,gy" -> true
    let activeCrates = {}; // id -> {x, y, gunType}
    let bullets = []; // {x, y, vx, vy, color, owner}

    const keys = {};
    let mouseX = 0;
    let mouseY = 0;
    let isMouseDown = false;

    const APP_PREFIX = "brian-2d-v1-";

    function getFormattedPeerId(code) {
      return APP_PREFIX + code.trim().toLowerCase();
    }

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Digit1') switchSlot(0);
      if (e.code === 'Digit2') switchSlot(1);
      if (e.code === 'Digit3') switchSlot(2);
      if (e.code === 'Digit4' && currentGun) switchSlot(3);
      if (e.code === 'Tab') {
        e.preventDefault();
        document.getElementById('tab-overlay').style.display = 'block';
        updateTabOverlay();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Tab') {
        document.getElementById('tab-overlay').style.display = 'none';
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      const screenCenterX = canvas.width / 2;
      const screenCenterY = canvas.height / 2;
      myAngle = Math.atan2(mouseY - screenCenterY, mouseX - screenCenterX);
    });

    canvas.addEventListener('mousedown', (e) => {
      if (document.getElementById('lobby-panel').style.display !== 'none' || document.getElementById('modal-overlay').style.display !== 'none') return;
      isMouseDown = true;
      handleAction();
    });

    canvas.addEventListener('mouseup', () => { isMouseDown = false; });

    function switchSlot(idx) {
      activeSlot = idx;
      for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`slot-${i}`);
        if (el) el.classList.toggle('active', i === activeSlot);
      }
    }

    function handleAction() {
      const screenCenterX = canvas.width / 2;
      const screenCenterY = canvas.height / 2;
      const worldTargetX = myX + (mouseX - screenCenterX);
      const worldTargetY = myY + (mouseY - screenCenterY);

      if (activeSlot === 2 && !blockCooldown) {
        // Place Block
        const gx = Math.floor(worldTargetX / TILE_SIZE);
        const gy = Math.floor(worldTargetY / TILE_SIZE);
        const key = `${gx},${gy}`;
        if (!placedBlocks[key]) {
          dispatchNetworkAction({ type: 'PLACE_BLOCK', key });
          blockCooldown = true;
          triggerCooldownBar('block-cd', 1000, () => blockCooldown = false);
        }
      } else if (activeSlot === 1) {
        // Pickaxe: break block or collect crate
        const gx = Math.floor(worldTargetX / TILE_SIZE);
        const gy = Math.floor(worldTargetY / TILE_SIZE);
        const key = `${gx},${gy}`;
        if (placedBlocks[key]) {
          dispatchNetworkAction({ type: 'BREAK_BLOCK', key });
        } else {
          // Check crate collection
          for (let cid in activeCrates) {
            const c = activeCrates[cid];
            const dist = Math.hypot(c.x - worldTargetX, c.y - worldTargetY);
            if (dist < 40) {
              dispatchNetworkAction({ type: 'COLLECT_CRATE', crateId: cid, gunType: c.gunType });
              break;
            }
          }
        }
      } else if (activeSlot === 0) {
        // Sword melee
        for (let pid in players) {
          const p = players[pid];
          const dist = Math.hypot(p.x - myX, p.y - myY);
          if (dist < 50) {
            if (gameMode !== 'ffa' && p.team === myTeam) continue;
            dispatchNetworkAction({ type: 'PLAYER_HIT', targetId: pid, damage: 35 });
          }
        }
      } else if (activeSlot === 3 && currentGun && !gunCooldown) {
        // Shoot Gun
        let cd = 300, dmg = 25, speed = 12;
        if (currentGun === 'shotgun') { cd = 700; dmg = 45; speed = 10; }
        if (currentGun === 'sniper') { cd = 1000; dmg = 80; speed = 20; }

        gunCooldown = true;
        setTimeout(() => gunCooldown = false, cd);

        const vx = Math.cos(myAngle) * speed;
        const vy = Math.sin(myAngle) * speed;
        bullets.push({ x: myX, y: myY, vx, vy, color: myTeamColor, owner: myId, damage: dmg });
        dispatchNetworkAction({ type: 'SPAWN_BULLET', x: myX, y: myY, vx, vy, color: myTeamColor, owner: myId, damage: dmg });
      }
    }

    function triggerCooldownBar(barId, duration, onComplete) {
      const bar = document.getElementById(barId);
      bar.style.width = '100%';
      let elapsed = 0;
      const interval = setInterval(() => {
        elapsed += 50;
        bar.style.width = `${Math.max(0, 100 - (elapsed / duration) * 100)}%`;
        if (elapsed >= duration) {
          clearInterval(interval);
          onComplete();
        }
      }, 50);
    }

    function showGamemodePicker(onChosen) {
      const overlay = document.getElementById('modal-overlay');
      const title = document.getElementById('modal-title');
      const buttons = document.getElementById('modal-buttons');
      
      title.innerText = "Select Game Mode";
      buttons.innerHTML = `
        <button class="team-btn-blue" id="mode-2t">2 Teams (Red vs Blue)</button>
        <button class="team-btn-green" id="mode-4t">4 Teams (Red, Blue, Green, Yellow)</button>
        <button class="team-btn-ffa" id="mode-ffa">Free For All (FFA)</button>
      `;
      overlay.style.display = 'flex';

      document.getElementById('mode-2t').onclick = () => { overlay.style.display = 'none'; onChosen('2team'); };
      document.getElementById('mode-4t').onclick = () => { overlay.style.display = 'none'; onChosen('4team'); };
      document.getElementById('mode-ffa').onclick = () => { overlay.style.display = 'none'; onChosen('ffa'); };
    }

    function showTeamPicker(mode, onTeamChosen) {
      const overlay = document.getElementById('modal-overlay');
      const title = document.getElementById('modal-title');
      const buttons = document.getElementById('modal-buttons');

      title.innerText = "Choose Your Team";
      let html = '';
      if (mode === '2team') {
        html = `
          <button class="team-btn-red" id="t-red">Red Team</button>
          <button class="team-btn-blue" id="t-blue">Blue Team</button>
        `;
      } else if (mode === '4team') {
        html = `
          <button class="team-btn-red" id="t-red">Red Team</button>
          <button class="team-btn-blue" id="t-blue">Blue Team</button>
          <button class="team-btn-green" id="t-green">Green Team</button>
          <button class="team-btn-yellow" id="t-yellow">Yellow Team</button>
        `;
      } else {
        html = `<button class="team-btn-ffa" id="t-ffa">Enter Free For All</button>`;
      }

      buttons.innerHTML = html;
      overlay.style.display = 'flex';

      if (document.getElementById('t-red')) document.getElementById('t-red').onclick = () => { overlay.style.display = 'none'; onTeamChosen('Red', '#e53935'); };
      if (document.getElementById('t-blue')) document.getElementById('t-blue').onclick = () => { overlay.style.display = 'none'; onTeamChosen('Blue', '#1e88e5'); };
      if (document.getElementById('t-green')) document.getElementById('t-green').onclick = () => { overlay.style.display = 'none'; onTeamChosen('Green', '#43a047'); };
      if (document.getElementById('t-yellow')) document.getElementById('t-yellow').onclick = () => { overlay.style.display = 'none'; onTeamChosen('Yellow', '#fbc02d'); };
      if (document.getElementById('t-ffa')) document.getElementById('t-ffa').onclick = () => { overlay.style.display = 'none'; onTeamChosen('FFA', '#7b1fa2'); };
    }

    function initPeer(customId, callback) {
      if (peer) peer.destroy();
      peer = new Peer(customId);

      peer.on('open', (id) => {
        myId = id;
        document.getElementById('peer-id-display').innerText = `Online ✅ (${currentRoomCode.toUpperCase()})`;
        if (callback) callback();
      });

      peer.on('error', (err) => {
        document.getElementById('peer-id-display').innerText = `Error: ${err.type}`;
        if (err.type === 'unavailable-id') {
          alert("Room '" + currentRoomCode.toUpperCase() + "' is already hosted! Choose 'Join Room' instead.");
        } else {
          alert("Connection error: " + err.type);
        }
      });

      peer.on('connection', (conn) => {
        if (!isHost) return;

        conn.on('open', () => {
          connections[conn.peer] = { conn, lastPing: Date.now(), name: 'Peer', team: 'FFA', color: '#2196f3' };
          conn.send({ type: 'SETUP_INFO', gameMode, placedBlocks, activeCrates });
          updateTabOverlay();
        });

        conn.on('data', (data) => handleHostReceiveData(conn.peer, data));
        conn.on('close', () => removePeer(conn.peer));
      });
    }

    function removePeer(peerId) {
      delete players[peerId];
      delete connections[peerId];
      updateTabOverlay();
    }

    function handleHostReceiveData(senderId, data) {
      if (connections[senderId]) connections[senderId].lastPing = Date.now();

      if (data.type === 'PLAYER_SYNC') {
        if (connections[senderId]) {
          connections[senderId].name = data.name;
          connections[senderId].team = data.team;
          connections[senderId].color = data.color;
        }

        players[senderId] = {
          x: data.x, y: data.y, angle: data.angle, name: data.name, team: data.team, color: data.color, hp: data.hp
        };

        broadcastState({ type: 'WORLD_STATE', players: serializePlayers() });
      } else if (data.type === 'ACTION') {
        processAction(data.action);
        broadcastState({ type: 'ACTION', action: data.action });
      }
    }

    function processAction(action) {
      if (action.type === 'PLACE_BLOCK') {
        placedBlocks[action.key] = true;
      } else if (action.type === 'BREAK_BLOCK') {
        delete placedBlocks[action.key];
      } else if (action.type === 'COLLECT_CRATE') {
        if (activeCrates[action.crateId]) {
          delete activeCrates[action.crateId];
          if (action.collectorId === myId || isHost) {
            // handle gun assignment if needed
          }
        }
      } else if (action.type === 'PLAYER_HIT') {
        if (action.targetId === myId) {
          hp = Math.max(0, hp - action.damage);
          if (hp <= 0) alert('You Died!');
        } else if (players[action.targetId]) {
          players[action.targetId].hp = Math.max(0, (players[action.targetId].hp || 100) - action.damage);
        }
      } else if (action.type === 'SPAWN_BULLET') {
        bullets.push({ x: action.x, y: action.y, vx: action.vx, vy: action.vy, color: action.color, owner: action.owner, damage: action.damage });
      }
    }

    function broadcastState(msg) {
      Object.values(connections).forEach(c => {
        if (c.conn && c.conn.open) c.conn.send(msg);
      });
    }

    function dispatchNetworkAction(action) {
      processAction(action);
      if (isHost) {
        broadcastState({ type: 'ACTION', action });
      } else if (hostConn && hostConn.open) {
        hostConn.send({ type: 'ACTION', action });
      }
    }

    function serializePlayers() {
      const state = {};
      Object.keys(players).forEach(id => {
        state[id] = players[id];
      });
      state[myId] = { x: myX, y: myY, angle: myAngle, name: myName, team: myTeam, color: myTeamColor, hp: hp };
      return state;
    }

    function updateTabOverlay() {
      const container = document.getElementById('peer-list-container');
      container.innerHTML = '';

      const localRow = document.createElement('div');
      localRow.className = 'player-row';
      localRow.innerHTML = `<span><b>${myName} (You)</b> [${myTeam}]</span><span style="color:#4caf50;">${isHost ? 'HOST' : 'CLIENT'} [HP: ${hp}]</span>`;
      container.appendChild(localRow);

      if (isHost) {
        Object.keys(connections).forEach(id => {
          const row = document.createElement('div');
          row.className = 'player-row';
          row.innerHTML = `<span>${connections[id].name || 'Peer'} [${connections[id].team}]</span><span style="color:#29b6f6;">CONNECTED</span>`;
          container.appendChild(row);
        });
      } else {
        Object.keys(players).forEach(id => {
          if (id === myId) return;
          const row = document.createElement('div');
          row.className = 'player-row';
          row.innerHTML = `<span>${players[id].name || 'Peer'} [${players[id].team || 'FFA'}]</span><span style="color:#29b6f6;">ONLINE [HP: ${players[id].hp || 100}]</span>`;
          container.appendChild(row);
        });
      }
    }

    document.getElementById('btn-host').addEventListener('click', () => {
      myName = document.getElementById('player-name-input').value.trim() || 'Host';
      currentRoomCode = document.getElementById('room-select').value;
      
      showGamemodePicker((selectedMode) => {
        gameMode = selectedMode;
        showTeamPicker(gameMode, (teamName, teamColor) => {
          myTeam = teamName;
          myTeamColor = teamColor;
          isHost = true;

          initPeer(getFormattedPeerId(currentRoomCode), () => {
            document.getElementById('lobby-panel').style.display = 'none';
            document.getElementById('status-msg').innerText = `Hosting Room: "${currentRoomCode.toUpperCase()}" [${gameMode.toUpperCase()}]`;
            startAirdropTimerLoop();
            updateTabOverlay();
          });
        });
      });
    });

    document.getElementById('btn-join').addEventListener('click', () => {
      myName = document.getElementById('player-name-input').value.trim() || 'Client';
      currentRoomCode = document.getElementById('room-select').value;
      
      isHost = false;
      document.getElementById('peer-id-display').innerText = "Locating Host...";

      initPeer(null, () => {
        const targetHostId = getFormattedPeerId(currentRoomCode);
        document.getElementById('peer-id-display').innerText = "Connecting to Host...";
        
        hostConn = peer.connect(targetHostId, { reliable: true });

        hostConn.on('open', () => {
          document.getElementById('peer-id-display').innerText = "Connected! Waiting for Setup...";
        });

        hostConn.on('error', () => {
          alert('Failed to connect to host room!');
        });

        hostConn.on('data', (data) => {
          if (data.type === 'SETUP_INFO') {
            gameMode = data.gameMode;
            if (data.placedBlocks) placedBlocks = data.placedBlocks;
            if (data.activeCrates) activeCrates = data.activeCrates;

            showTeamPicker(gameMode, (teamName, teamColor) => {
              myTeam = teamName;
              myTeamColor = teamColor;

              document.getElementById('lobby-panel').style.display = 'none';
              document.getElementById('status-msg').innerText = `Joined Room: "${currentRoomCode.toUpperCase()}" [${gameMode.toUpperCase()}]`;
              updateTabOverlay();
            });
          } else if (data.type === 'WORLD_STATE') {
            Object.keys(data.players).forEach(id => {
              if (id === myId) return;
              players[id] = data.players[id];
            });
            updateTabOverlay();
          } else if (data.type === 'ACTION') {
            processAction(data.action);
          } else if (data.type === 'SPAWN_DROP') {
            activeCrates[data.crateId] = { x: data.x, y: data.y, gunType: data.gunType };
          } else if (data.type === 'AIRDROP_TIMER') {
            startAirdropCountdown(data.seconds);
          }
        });
      });
    });

    let airdropCountdown = 20;
    function startAirdropTimerLoop() {
      if (!isHost) return;
      setInterval(() => {
        airdropCountdown--;
        broadcastState({ type: 'AIRDROP_TIMER', seconds: airdropCountdown });
        startAirdropCountdown(airdropCountdown);

        if (airdropCountdown <= 0) {
          airdropCountdown = 25;
          const dropX = Math.random() * (WORLD_SIZE - 200) + 100;
          const dropY = Math.random() * (WORLD_SIZE - 200) + 100;
          const crateId = 'crate_' + Math.random().toString(36).substr(2, 9);
          const gunTypes = ['pistol', 'shotgun', 'sniper'];
          const assignedGun = gunTypes[Math.floor(Math.random() * gunTypes.length)];

          activeCrates[crateId] = { x: dropX, y: dropY, gunType: assignedGun };
          broadcastState({ type: 'SPAWN_DROP', crateId, x: dropX, y: dropY, gunType: assignedGun });
        }
      }, 1000);
    }

    function startAirdropCountdown(secs) {
      document.getElementById('airdrop-timer').innerText = `${Math.max(0, secs)}s`;
    }

    let lastTime = performance.now();

    function gameLoop(now) {
      requestAnimationFrame(gameLoop);
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // Movement & Sprinting (Shift key instead of Ctrl)
      const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
      let speed = 4;
      if (isSprinting && (keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD']) && stamina > 0) {
        speed *= 1.7;
        stamina = Math.max(0, stamina - delta * 30);
      } else {
        stamina = Math.min(maxStamina, stamina + delta * 15);
      }

      document.getElementById('stamina-fill').style.width = `${stamina}%`;
      document.getElementById('stamina-val').innerText = Math.round(stamina);
      document.getElementById('hp-fill').style.width = `${hp}%`;
      document.getElementById('hp-val').innerText = hp;

      let dx = 0, dy = 0;
      if (keys['KeyW']) dy -= speed;
      if (keys['KeyS']) dy += speed;
      if (keys['KeyA']) dx -= speed;
      if (keys['KeyD']) dx += speed;

      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

      myX = Math.max(20, Math.min(WORLD_SIZE - 20, myX + dx));
      myY = Math.max(20, Math.min(WORLD_SIZE - 20, myY + dy));

      // Bullet Physics
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // Check collision with placed blocks
        const bgx = Math.floor(b.x / TILE_SIZE);
        const bgy = Math.floor(b.y / TILE_SIZE);
        if (placedBlocks[`${bgx},${bgy}`]) {
          bullets.splice(i, 1);
          continue;
        }

        // Check collision with players
        for (let pid in players) {
          if (pid === myId || pid === b.owner) continue;
          const p = players[pid];
          if (Math.hypot(p.x - b.x, p.y - b.y) < 20) {
            if (gameMode !== 'ffa' && p.team === myTeam) continue;
            dispatchNetworkAction({ type: 'PLAYER_HIT', targetId: pid, damage: b.damage });
            bullets.splice(i, 1);
            break;
          }
        }
      }

      // Sync position with host/peers
      if (Math.random() < 0.3) {
        const payload = {
          type: 'PLAYER_SYNC',
          name: myName,
          x: myX, y: myY, angle: myAngle,
          team: myTeam, color: myTeamColor, hp: hp
        };
        if (isHost) {
          broadcastState({ type: 'WORLD_STATE', players: serializePlayers() });
        } else if (hostConn && hostConn.open) {
          hostConn.send(payload);
        }
      }

      // RENDER
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2 - myX, canvas.height / 2 - myY);

      // Draw Grid / Arena Background
      ctx.strokeStyle = '#2d2d3d';
      ctx.lineWidth = 1;
      for (let x = 0; x <= WORLD_SIZE; x += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
      }
      for (let y = 0; y <= WORLD_SIZE; y += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
      }

      // Draw Placed Blocks
      ctx.fillStyle = '#8d5b4c';
      ctx.strokeStyle = '#5c382b';
      for (let key in placedBlocks) {
        const [gx, gy] = key.split(',').map(Number);
        ctx.fillRect(gx * TILE_SIZE, gy * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        ctx.strokeRect(gx * TILE_SIZE, gy * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }

      // Draw Airdrop Crates
      for (let cid in activeCrates) {
        const c = activeCrates[cid];
        ctx.fillStyle = c.gunType === 'sniper' ? '#2c5e3b' : (c.gunType === 'shotgun' ? '#b85d19' : '#d4a373');
        ctx.fillRect(c.x - 15, c.y - 15, 30, 30);
        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.fillText('📦 ' + c.gunType.toUpperCase(), c.x - 20, c.y - 20);
      }

      // Draw Players
      const allPlayers = { ...players };
      allPlayers[myId] = { x: myX, y: myY, angle: myAngle, name: myName, team: myTeam, color: myTeamColor, hp: hp };

      for (let pid in allPlayers) {
        const p = allPlayers[pid];
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        // Body
        ctx.fillStyle = p.color || '#2196f3';
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Gun barrel
        ctx.fillStyle = '#444';
        ctx.fillRect(0, -4, 22, 8);
        ctx.restore();

        // Name tag & HP bar
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name + ` [${p.team}]`, p.x, p.y - 25);

        ctx.fillStyle = '#e53935';
        ctx.fillRect(p.x - 20, p.y - 22, 40, 5);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(p.x - 20, p.y - 22, 40 * (p.hp / 100), 5);
      }

      // Draw Bullets
      for (let b of bullets) {
        ctx.fillStyle = b.color || '#ffeb3b';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
